[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gnss-sentinel"
version = "1.0.0"
description = "GNSS interference research, signal analysis, and experiment platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "numpy>=2.1,<3", "scipy>=1.14,<2", "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "pillow>=11,<13"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
vision = ["torch>=2.6,<3", "torchvision>=0.21,<1"]
excel = ["openpyxl>=3.1,<4"]

[project.scripts]
gnss-sentinel = "gnss_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gnss_sentinel = ["web/*", "catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
